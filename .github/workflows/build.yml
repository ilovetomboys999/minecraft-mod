name: Build Minecraft Forge Mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Locate or Unzip Mod & Build JAR
        run: |
          echo "Repository contents:"
          ls -la

          BUILD_FILE=$(find . -maxdepth 5 -name "build.gradle" | head -n 1)
          if [ -z "$BUILD_FILE" ]; then
            ZIP_FILE=$(find . -maxdepth 3 -name "*.zip" | head -n 1)
            if [ -n "$ZIP_FILE" ]; then
              echo "Unzipping $ZIP_FILE..."
              unzip -o "$ZIP_FILE" -d extracted-mod
              BUILD_FILE=$(find extracted-mod -maxdepth 5 -name "build.gradle" | head -n 1)
            fi
          fi

          if [ -z "$BUILD_FILE" ]; then
            echo "No build.gradle or .zip found in repository."
            exit 1
          fi

          MOD_DIR=$(dirname "$BUILD_FILE")
          echo "Found mod project in: $MOD_DIR"
          echo "MOD_DIR=$MOD_DIR" >> "$GITHUB_ENV"

          cd "$MOD_DIR"
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew build --no-daemon
          else
            gradle build --no-daemon
          fi

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-Mod
          path: ${{ env.MOD_DIR }}/build/libs/*.jar
          if-no-files-found: error
